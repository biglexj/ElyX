# Configuración de tareas de ElyX mediante Mise
# Entrada principal de comandos: dev, build, check, test, release, publish
# Contrato: Docs/global/architecture/mise-command-standard.md

[tasks.setup]
raw_args = true
description = "Crear el entorno virtual .venv e instalar ElyX con sus extras de desarrollo"
file = "scripts/mise-task.ts"

[tasks.dev]
raw_args = true
description = "Ejecutar la suite de pruebas en el bucle de desarrollo"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Generar los paquetes distribuibles (wheel y sdist) en dist/"
file = "scripts/mise-task.ts"

[tasks.check]
raw_args = true
description = "Verificar la sintaxis del código fuente y de las pruebas sin emitir artefactos"
file = "scripts/mise-task.ts"

[tasks.test]
raw_args = true
description = "Ejecutar la suite de pruebas automatizadas"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "Preparar los artefactos de distribución y sus sumas SHA-256 en dist/ sin publicar"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "Publicar release en GitHub (--plan y --check sin escritura)"
file = "scripts/mise-task.ts"
