# Configuración de tareas de ElyX mediante Mise
# Reutiliza el estándar común: dev, build, release, publish

[tasks.dev]
raw_args = true
description = "Ejecutar pruebas o CLI de ElyX en desarrollo (Python)"
file = "scripts/mise-task.ts"

[tasks.build]
raw_args = true
description = "Compilar y verificar sintaxis de Python sin generar paquetes distribuibles"
file = "scripts/mise-task.ts"

[tasks.release]
raw_args = true
description = "Generar paquetes distribuibles locales (wheel y sdist en dist/) sin publicar"
file = "scripts/mise-task.ts"

[tasks.publish]
raw_args = true
description = "Publicar release en GitHub (--plan y --check sin escritura)"
file = "scripts/mise-task.ts"
